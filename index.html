<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Robô | Feira de Ciências</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--marinho:#1a1c4d;--amarelo:#ffd23f;--vermelho:#ff4d6d;--verde:#46d17a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Press Start 2P','Courier New',monospace;font-size:11px;line-height:1.8;color:#fff;
  background-color:#14308a;
  background-image:linear-gradient(#1b3fb0 50%,transparent 50%);background-size:100% 48px;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--amarelo);outline-offset:4px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;height:100dvh;padding:18px 22px;align-items:center}
.palco{display:grid;place-items:center;gap:14px;min-width:0}
.tela{position:relative;width:min(100%,calc((100dvh - 60px) * 2));aspect-ratio:2/1;border:4px solid #fff;box-shadow:0 0 0 4px #000,10px 10px 0 4px rgba(0,0,0,.45);background:#6ec6ff}
#jogo{display:block;width:100%;height:100%;image-rendering:pixelated}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:10px;overflow:auto;background:rgba(20,30,90,.6)}
.overlay[hidden]{display:none}
.cartao{width:min(660px,100%);background:var(--marinho);border:4px solid #fff;box-shadow:0 0 0 4px #000,6px 6px 0 4px rgba(0,0,0,.5);padding:clamp(12px,2vw,20px);text-align:center}
.titulo{font-size:clamp(18px,3.6vw,34px);line-height:1.25;color:var(--amarelo);text-shadow:4px 4px 0 var(--vermelho)}
.cartao p{margin-top:10px}
.legenda{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;font-size:9px;line-height:1.5}
.legenda div{display:grid;justify-items:center;gap:6px}
.legenda img{width:40px;height:40px;image-rendering:pixelated;object-fit:contain}
.cartao input{width:100%;padding:12px;font:inherit;font-size:14px;text-align:center;border:4px solid #fff;background:#fff;color:var(--marinho);margin-top:4px}
.cartao input::placeholder{color:#8e91c9}
.botao{border:0;padding:14px 22px;font-size:14px;background:var(--amarelo);color:var(--marinho);
  box-shadow:inset -4px -4px 0 #d9a400,inset 4px 4px 0 #fff0a0,0 0 0 4px #000;transition:transform .06s}
.botao:active{transform:translateY(3px)}
.botao.claro{background:#fff;box-shadow:inset -4px -4px 0 #aab,inset 4px 4px 0 #fff,0 0 0 4px #000;font-size:10px;padding:10px 14px}
.botao.grande{width:100%;margin-top:14px;font-size:18px;animation:pisca 1s steps(2) infinite}
.dica{font-size:9px;opacity:.85}
.estrelas{display:flex;justify-content:center;gap:10px;margin:8px 0}
.estrela{font-size:clamp(28px,6vw,44px);line-height:1;filter:grayscale(1) opacity(.3)}
.estrela.on{filter:none;animation:estrela .4s steps(4) both;animation-delay:calc(var(--i) * .3s)}
.final-pontos{font-size:clamp(26px,5.5vw,44px);color:var(--amarelo)}
.nivel{display:inline-block;margin-top:6px;padding:6px 12px;background:var(--vermelho)}
.linha{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}

.toque{display:none;width:100%;justify-content:space-between;gap:12px}
.toque div{display:flex;gap:12px}
.toque .botao{padding:18px 22px;font-size:18px}

.rank{background:var(--marinho);border:4px solid #fff;box-shadow:0 0 0 4px #000,8px 8px 0 4px rgba(0,0,0,.5);padding:16px;max-height:100%;display:flex;flex-direction:column}
.rank h2{font-size:14px;line-height:1.5;color:var(--amarelo)}
.rank ol{list-style:none;margin:12px 0;display:grid;gap:4px;overflow:auto}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:center;padding:4px 6px;font-size:10px}
.rank li b{font-weight:400;text-align:center;font-size:14px}
.rank li.novo{background:var(--vermelho)}
.rank li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li em{font-style:normal;color:var(--amarelo)}
.rank li.novo em{color:#fff}
.vazio{display:block!important;line-height:1.6}
.ferramentas{display:grid;gap:10px}
.escola{margin-top:12px;font-size:8px;opacity:.7;line-height:1.6}

@keyframes pisca{50%{background:#fff0a0}}
@keyframes estrela{from{transform:scale(0)}to{transform:none}}

@media (pointer:coarse){.toque{display:flex}}
@media (max-width:820px){
  body{font-size:10px}
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh;padding:12px;align-items:start}
  .tela{width:100%}
  .legenda{grid-template-columns:repeat(2,1fr)}
  .overlay{position:fixed;z-index:10;background:rgba(20,30,90,.92)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="app">
  <section class="palco">
    <div class="tela" id="tela">
      <canvas id="jogo" width="800" height="400" aria-label="Área do jogo"></canvas>

      <div class="overlay" id="tela-inicio">
        <div class="cartao">
          <h1 class="titulo">SUPER ROBÔ</h1>
          <p>Complete as 5 missões e chegue às bandeiras!</p>
          <div class="legenda" id="legenda"></div>
          <input id="nome" maxlength="12" autocomplete="off" placeholder="SEU NOME" aria-label="Seu nome">
          <button class="botao grande" id="b-jogar" type="button">COMEÇAR</button>
          <p class="dica">Andar: setas ou A e D. Pular: ESPAÇO (segure para pular mais alto).</p>
        </div>
      </div>

      <div class="overlay" id="tela-fim" hidden>
        <div class="cartao">
          <h2 class="titulo" style="font-size:clamp(13px,2.4vw,22px)" id="f-nome">FIM DE JOGO</h2>
          <div class="estrelas" id="f-estrelas"></div>
          <div class="final-pontos" id="f-pontos">0</div>
          <div class="nivel" id="f-nivel"></div>
          <p id="f-extra"></p>
          <p id="f-pos"></p>
          <div class="linha">
            <button class="botao" id="b-de-novo" type="button">JOGAR DE NOVO</button>
            <button class="botao claro" id="b-proximo" type="button">PRÓXIMO JOGADOR</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toque" id="toque">
      <div><button class="botao" data-k="e" type="button" aria-label="Esquerda">◀</button><button class="botao" data-k="d" type="button" aria-label="Direita">▶</button></div>
      <button class="botao" data-k="p" type="button">PULAR</button>
    </div>
  </section>

  <aside class="rank">
    <h2>MELHORES ROBÔS</h2>
    <ol id="lista"></ol>
    <div class="ferramentas">
      <button class="botao claro" id="b-tela" type="button">TELA CHEIA (F)</button>
      <button class="botao claro" id="b-som" type="button">SOM: LIGADO (M)</button>
      <button class="botao claro" id="b-zerar" type="button">ZERAR RANKING</button>
    </div>
    <p class="escola">Feira de Ciências – Escola Alexandre de Gusmão</p>
  </aside>
</main>

  /* ---------- Sprites em pixel art (todos desenhados do zero) ---------- */
  const PAL = { k:'#1a1c4d', b:'#4fb8ff', l:'#c4ecff', w:'#ffffff', y:'#ffd23f', r:'#ff4d6d', g:'#46d17a' };

  function spr(rows, pal = PAL) {
    const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
    const x = c.getContext('2d');
    rows.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); } }));

    '.kbbbbbbbbk.', '.kbbkkkkbbk.', '..kkkkkkkk..', '.kkbbbbbbkk.', '.kbbllllbbk.', '.kkbbbbbbkk.'
  ];
  const PERNAS = { a: ['..kkk..kkk..', '.kkk....kkk.'], b: ['..kkk..kkk..', '..kkk..kkk..'], j: ['..kkk..kkk..', '...kk..kk...'] };
  const ROBO = {}, ROBOG = {};
  for (const f in PERNAS) { ROBO[f] = spr([...TOPO, ...PERNAS[f]]); ROBOG[f] = spr([...TOPO, ...PERNAS[f]], PALG); }
  const BUG = spr(['..k....k..','...k..k...','..kkkkkk..','.krwrrwrk.','kkrrrrrrkk','.krrrrrrk.','k.k.kk.k.k']);
  const BUGP = spr(['..........','..........','..........','..........','.kkkkkkkk.','kkrwrrwrkk','kkkkkkkkkk']);
  const VIRUS = spr(['....kk....','..k.kk.k..','...kggk...','k.kggggk.k','.kgwggwgk.','kkggggggkk','.kggkkggk.','k.kggggk.k','...kggk...','..k.kk.k..']);
  const ESTR = spr(['...yy...','...yy...','yyyyyyyy','.yyyyyy.','..yyyy..','.yyyyyy.','.yy..yy.','yy....yy']);
  const CORA = spr(['.rr.rr.','rrrrrrr','rrrrrrr','.rrrrr.','..rrr..','...r...']);
  const BAT = spr(['..kkkk..','..kyyk..','.kkkkkk.','.kggggk.','.kgyggk.','.kggyyk.','.kgyggk.','.kggggk.','.kkkkkk.']);

    t[1] = mk(g => { R(g,q.gb,0,0,T,T); R(g,q.gt,0,0,T,10); R(g,q.gd,0,10,T,4); R(g,q.gm,6,22,10,6); R(g,q.gm,24,30,10,6); });

      for (let i = 0; i < 8; i++) {
        const x = mod(i * 130 - camx * .3, W + 130) - 65;
        cx.beginPath(); cx.moveTo(x - 40, 0); cx.lineTo(x + 40, 0); cx.lineTo(x, 80 + (i % 3) * 35); cx.fill();
        cx.beginPath(); cx.moveTo(x + 40, 320); cx.lineTo(x + 110, 320); cx.lineTo(x + 75, 230 - (i % 3) * 30); cx.fill();
      }
      for (let i = 0; i < 6; i++) {
        const x = mod(i * 190 - camx * .5, W + 190) - 95, y = 130 + (i * 47) % 120;
        cx.globalAlpha = .6 + Math.sin(anima / 20 + i) * .3; cx.fillStyle = '#6ee7ff';
        cx.beginPath(); cx.moveTo(x, y - 14); cx.lineTo(x + 9, y); cx.lineTo(x, y + 14); cx.lineTo(x - 9, y); cx.fill();
      }
      cx.globalAlpha = 1;
    } else if (tema === 2) {
      cx.fillStyle = gNoite; cx.fillRect(0, 0, W, H);
      cx.fillStyle = '#fff';
      for (let i = 0; i < 40; i++) if ((i + Math.floor(anima / 30)) % 7) cx.fillRect(mod(i * 97 - camx * .05, W), (i * 53) % 220, 2, 2);
      cx.fillStyle = '#fff6c4'; cx.beginPath(); cx.arc(660, 70, 28, 0, 7); cx.fill();
      const off = -(camx * .3) % 1600;
      predios.forEach((b, bi) => {
        for (const o of [off, off + 1600]) {
          const bx = b.x + o; if (bx > W || bx + b.w < 0) continue;
          cx.fillStyle = '#1b1f5a'; cx.fillRect(bx, 320 - b.h, b.w, b.h);
          cx.fillStyle = '#ffd23f';
          for (let yy = 320 - b.h + 14; yy < 300; yy += 28) for (let xx = bx + 10; xx < bx + b.w - 14; xx += 22) if ((xx + yy + bi) % 3) cx.fillRect(xx, yy, 8, 8);
        }
      });
    } else if (tema === 3) {                              // fábrica: engrenagens girando ao fundo
      cx.fillStyle = '#3a3f4e'; cx.fillRect(0, 0, W, H);
      cx.strokeStyle = '#4d5366'; cx.lineWidth = 14;
      for (let i = 0; i < 5; i++) {
        const x = mod(i * 220 - camx * .3, W + 220) - 110, y = 90 + (i % 2) * 120, r = 50 + (i % 3) * 14;
        cx.setLineDash([12, 10]); cx.lineDashOffset = (i % 2 ? 1 : -1) * anima * .4;
        cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.stroke();
        cx.setLineDash([]); cx.lineWidth = 6; cx.beginPath(); cx.arc(x, y, r - 22, 0, 7); cx.stroke(); cx.lineWidth = 14;
      }
      cx.setLineDash([]);
    } else {                                              // castelo: parede de tijolos, tochas e lava
      cx.fillStyle = '#1a0f1f'; cx.fillRect(0, 0, W, H);
      cx.fillStyle = '#2a1830';
      for (let r = 0; r < 9; r++) for (let c = -1; c < 12; c++) {
        const x = mod(c * 80 + (r % 2) * 40 - camx * .4, W + 160) - 80;
        cx.fillRect(x, r * 40 + 2, 76, 36);
      }
      for (let i = 0; i < 4; i++) {
        const x = mod(i * 260 - camx * .4, W + 260) - 130 + 40;
        cx.fillStyle = '#5a3a2a'; cx.fillRect(x - 3, 150, 6, 22);
        cx.fillStyle = Math.floor(anima / 6 + i) % 2 ? '#ffd23f' : '#ff9a3d'; cx.fillRect(x - 6, 130, 12, 20);
        cx.fillStyle = '#fff3a0'; cx.fillRect(x - 2, 138, 4, 8);
      }
      cx.fillStyle = Math.floor(anima / 10) % 2 ? '#ff6a2a' : '#ff8f3a'; cx.fillRect(0, 372, W, 28);   // lava nos buracos
    }
  }

  function desenha() {
    const camx = Math.round(cam), ts = TS[tema];
    fundo(camx);

    itens.forEach(it => cx.drawImage(BAT, it.x - 1 - camx, it.y - 6, 32, 36));   // antes dos blocos e canos: saem de dentro deles
    plantas.forEach(pl => cx.drawImage(FLOR, pl.x - 4 - camx, pl.topo - pl.alt, 36, 42));

    const c0 = Math.floor(camx / T);
    for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c0 + 21; c++) {
      if (c < 0 || c >= COLS) continue;
      let t = map[r][c]; if (!t) continue;
      if (t === 5 && !(r > 0 && map[r - 1][c] === 5)) t = 7;
      const b = bumps[r * COLS + c] ? -Math.sin(bumps[r * COLS + c] / 8 * Math.PI) * 8 : 0;
      cx.drawImage(ts[t], c * T - camx, r * T + b);
    }

    cx.fillStyle = achouCheck ? '#46d17a' : '#aab3c8'; cx.fillRect(CHECKX + 14 - camx, 4 * T + 20, 4, 4 * T - 20);
    cx.fillStyle = achouCheck ? '#46d17a' : '#ff4d6d'; cx.fillRect(CHECKX + 18 - camx, 4 * T + 20, 22, 14);
    cx.fillStyle = '#e8e8f0'; cx.fillRect(POLEX + 9 - camx, 2 * T, 6, 6 * T);
    cx.fillStyle = '#ffd23f'; cx.fillRect(POLEX + 5 - camx, 2 * T - 10, 14, 14);
    cx.fillStyle = '#ff4d6d'; const o = Math.sin(anima / 12) * 3;
    cx.beginPath(); cx.moveTo(POLEX + 9 - camx, 2 * T + 6); cx.lineTo(POLEX - 34 - camx, 2 * T + 26 + o); cx.lineTo(POLEX + 9 - camx, 2 * T + 46); cx.fill();

    const bob = Math.sin(anima / 12) * 3;
    estr.forEach(s => { if (!s.pego && s.x - camx > -40 && s.x - camx < W) cx.drawImage(ESTR, s.x - camx, s.y + bob, 32, 32); });
    ini.forEach(e => {
      if (e.y > H || e.x - camx < -60 || e.x - camx > W) return;
      if (e.tipo === 'virus') { cx.drawImage(VIRUS, e.x - 4 - camx, e.y - 8, 40, 40); return; }
      if (e.tipo === 'casco') {
        if (e.estado === 0) {                              // caracol: espelhado quando anda para a direita
          const dx = Math.round(e.x - 2 - camx);
          cx.save();
          if (e.vx > 0) { cx.translate(dx + 36, e.y); cx.scale(-1, 1); cx.drawImage(CASCO, 0, 0, 36, 30); } else cx.drawImage(CASCO, dx, e.y, 36, 30);
          cx.restore();
        } else cx.drawImage(CASCOP, e.x - 2 - camx, e.y, 36, 24);
        return;
      }
      cx.drawImage(e.morto ? BUGP : BUG, e.x - 4 - camx, e.y - 2, 40, 28);
    });
    balas.forEach(b => {
      const dx = Math.round(b.x - 3 - camx);
      cx.save();
      if (b.vx < 0) { cx.translate(dx + 36, b.y - 3); cx.scale(-1, 1); cx.drawImage(BALA, 0, 0, 36, 30); } else cx.drawImage(BALA, dx, b.y - 3, 36, 30);
      cx.restore();
    });

    if (!(inv > 0 && Math.floor(inv / 100) % 2)) {
      let grande = p.big;
      if (transf > 0) grande = Math.floor(transf / 4) % 2 === 0 ? p.big : !p.big;   // pisca entre pequeno e grande
      const q = !p.noChao ? 'j' : Math.abs(p.vx) > .5 ? (Math.floor(anima / 6) % 2 ? 'a' : 'b') : 'b';
      const f = (grande ? ROBOG : ROBO)[q];
      const dw = grande ? 48 : 36, dh = grande ? 56 : 42;
      const dx = Math.round(p.x + p.w / 2 - dw / 2 - camx), dy = Math.round(p.y + p.h - dh + (grande ? 0 : 4));
      cx.save();
      if (p.dir < 0) { cx.translate(dx + dw, dy); cx.scale(-1, 1); cx.drawImage(f, 0, 0, dw, dh); } else cx.drawImage(f, dx, dy, dw, dh);
      cx.restore();
    }
    ps.forEach(q => { cx.fillStyle = q.c; cx.fillRect(q.x - camx, q.y, q.t, q.t); });
    pops.forEach(q => txt(q.s, q.x - camx, q.y, 'center', 12, '#ffd23f'));

    if (modo === 'jogo' || modo === 'intro') {
      txt('PONTOS ' + String(pontos).padStart(5, '0'), 16, 14, 'left', 13, '#fff');
      cx.drawImage(ESTR, 250, 12, 22, 22); txt('x' + coletadas, 280, 16, 'left', 13, '#ffd23f');
      txt('MISSÃO ' + (fase + 1) + '/' + FASES.length, 520, 16, 'center', 11, '#fff');
      txt('TEMPO ' + Math.max(0, Math.ceil(restante)), W - 16, 50, 'right', 11, restante < 30 ? '#ff4d6d' : '#fff');
      if (p.big) txt('SUPER!', 16, 48, 'left', 11, '#ff9a3d');
      for (let i = 0; i < VIDAS; i++) { cx.globalAlpha = i < vidas ? 1 : .25; cx.drawImage(CORA, W - 16 - (VIDAS - i) * 30, 12, 21, 18); }
      cx.globalAlpha = 1;
    }
    if (modo === 'intro') {
      cx.fillStyle = 'rgba(10,12,50,.72)'; cx.fillRect(0, 0, W, H);
      txt('MISSÃO ' + (fase + 1), W / 2, 120, 'center', 34, '#ffd23f');
      txt(FASES[fase].nome, W / 2, 190, 'center', 16, '#fff');
      if (Math.floor(anima / 15) % 2) txt('PREPARE-SE!', W / 2, 250, 'center', 14, '#ff9a3d');
    }
  }

  let ultimo = 0, acum = 0;
  function frame(now) {
    acum += Math.min(100, now - ultimo); ultimo = now;
    while (acum >= 16.667) { passo(); acum -= 16.667; }
    desenha();
    requestAnimationFrame(frame);
  }

  /* ---------- Fluxo do jogo ---------- */
  function abrirFase() {
    novoMundo(fase); inv = 0; restante = TEMPO; cpAnt = false;
    k.e = k.d = k.p = false;
    modo = 'intro'; introT = 130;
    tom(392, .12); tom(523, .12, 'square', .06, .12); tom(659, .25, 'square', .06, .24);
  }

  function iniciar() {
    if (modo === 'intro' || modo === 'jogo') return;
    clearTimeout(voltaT);
    nome = (($('#nome').value.trim() || 'Visitante').slice(0, 12)).toUpperCase();
    $('#tela-inicio').hidden = true; $('#tela-fim').hidden = true;
    pontos = 0; vidas = VIDAS; coletadas = 0; pisados = 0; bonusTotal = 0; fase = 0;
    modo = 'intro'; abrirFase();
  }

  function vencerFase() {
    const bonus = Math.ceil(Math.max(0, restante)) * 5 + 200;
    pontos += bonus; bonusTotal += bonus;
    [523, 659, 784, 1046].forEach((f, i) => tom(f, .2, 'square', .06, i * .12));
    if (fase >= FASES.length - 1) {
      const extra = vidas * 50; pontos += extra; bonusTotal += extra;
      terminar(true, 'VOCÊ ZEROU O JOGO!');
    } else { fase++; abrirFase(); }
  }

  function terminar(venceu, titulo) {
    if (modo === 'fim') return;
    if (!venceu) [392, 330, 262].forEach((f, i) => tom(f, .25, 'square', .06, i * .18));
    modo = 'fim';
    const pos = salvar(nome, pontos);
    const nivel = [...NIVEIS].reverse().find(n => pontos >= n[0])[1];
    const est = ESTRELAS.find(e => pontos >= e[0])[1];
    $('#f-nome').textContent = nome + ', ' + titulo;
    $('#f-pontos').textContent = pontos;
    $('#f-nivel').textContent = nivel.toUpperCase();
    $('#f-extra').textContent = 'Missão ' + (venceu ? FASES.length : fase + 1) + ' de ' + FASES.length + '  Estrelas: ' + coletadas + '  Bugs pisados: ' + pisados + '  Bônus: +' + bonusTotal;
    const box = $('#f-estrelas'); box.textContent = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 'estrela' + (i < est ? ' on' : ''); s.textContent = '⭐'; s.style.setProperty('--i', i); box.appendChild(s);
    }
    $('#f-pos').textContent = pos === 1 ? 'NOVO RECORDE DA FEIRA!' : pos ? 'Você ficou em ' + pos + 'º lugar.' : 'Tente de novo para entrar no ranking!';
    $('#tela-fim').hidden = false;
    demoFase = 0; novoMundo(0);                   // a demonstração volta a rodar atrás da tela
    voltaT = setTimeout(proximo, 30000);
  }

  function proximo() {
    clearTimeout(voltaT);
    modo = 'espera'; $('#nome').value = '';
    $('#tela-fim').hidden = true; $('#tela-inicio').hidden = false;
    demoFase = 0; novoMundo(0); $('#nome').focus();
  }

  /* ---------- Ranking (salvo neste navegador) ---------- */
  function lerRank() { try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; } }
  function gravarRank(l) { try { localStorage.setItem(CHAVE, JSON.stringify(l)); } catch (e) { /* sem armazenamento */ } }

  function salvar(n, pt) {
    const l = lerRank(), id = Date.now();
    l.push({ id, nome: n, pontos: pt });
    l.sort((a, b) => b.pontos - a.pontos || a.id - b.id);
    const top = l.slice(0, 50);
    gravarRank(top); desenhaRank(id);
    return top.findIndex(x => x.id === id) + 1;
  }

  function desenhaRank(destaque) {
    const ol = $('#lista'); ol.textContent = '';
    const l = lerRank().slice(0, 10);
    if (!l.length) {
      const li = document.createElement('li'); li.className = 'vazio'; li.textContent = 'Ninguém jogou ainda. Seja o primeiro!';
      ol.appendChild(li); return;
    }
    l.forEach((x, i) => {
      const li = document.createElement('li'); if (x.id === destaque) li.className = 'novo';
      const b = document.createElement('b'); b.textContent = ['🥇', '🥈', '🥉'][i] || (i + 1);
      const s = document.createElement('span'); s.textContent = x.nome;
      const e = document.createElement('em'); e.textContent = x.pontos;
      li.append(b, s, e); ol.appendChild(li);
    });
  }

  /* ---------- Controles ---------- */
  function alternaSom() { mudo = !mudo; $('#b-som').textContent = 'SOM: ' + (mudo ? 'DESLIGADO' : 'LIGADO') + ' (M)'; }
  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  document.querySelectorAll('.toque [data-k]').forEach(b => {
    const set = v => e => { e.preventDefault(); k[b.dataset.k] = v; };
    b.addEventListener('pointerdown', set(true));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, set(false)));
  });

  $('#b-jogar').addEventListener('click', iniciar);
  $('#b-de-novo').addEventListener('click', iniciar);
  $('#b-proximo').addEventListener('click', proximo);
  $('#b-som').addEventListener('click', alternaSom);
  $('#b-tela').addEventListener('click', telaCheia);
  $('#b-zerar').addEventListener('click', () => { if (confirm('Apagar todo o ranking?')) { gravarRank([]); desenhaRank(); } });

  const TECLA = { ArrowLeft: 'e', a: 'e', A: 'e', ArrowRight: 'd', d: 'd', D: 'd', ArrowUp: 'p', w: 'p', W: 'p', ' ': 'p' };
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') { if (modo === 'espera' || modo === 'fim') iniciar(); return; }
    if (e.target && e.target.tagName === 'INPUT') return;
    if (TECLA[e.key]) { e.preventDefault(); k[TECLA[e.key]] = true; return; }
    const u = e.key.toUpperCase();
    if (u === 'M') alternaSom();
    if (u === 'F') telaCheia();
  });
  document.addEventListener('keyup', e => { if (TECLA[e.key]) k[TECLA[e.key]] = false; });
  window.addEventListener('blur', () => { k.e = k.d = k.p = false; });

  novoMundo(0);
  desenhaRank();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
